	<style>

		/* Markdown Body Typography */
		.article-body h1, .article-body h2, .article-body h3, .article-body h4 {

			font-weight: 700;

		.article-body h1 { font-size: 2rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem; }
		.article-body h2 { font-size: 1.6rem; color: #c084fc; }

		.article-body p {
			color: #e2e8f0;
			font-size: 1.05rem;
			margin-bottom: 1.5rem;
		}

		.article-body ul, .article-body ol {
			color: #e2e8f0;
			margin-bottom: 1.5rem;
			padding-left: 1.5rem;
		}

		.article-body li {
			margin-bottom: 0.5rem;
		}

		.article-body blockquote {
			border-left: 4px solid var(--primary-color);
			background: rgba(99, 102, 241, 0.08);
			padding: 1rem 1.5rem;
			border-radius: 0 1rem 1rem 0;
			margin: 1.5rem 0;
			color: #cbd5e1;
			font-style: italic;
		}

		.article-body pre {
			background: #1e1e2e !important;
			border: 1px solid var(--border-glass);
			border-radius: 1rem;
			padding: 1.2rem;
			margin: 1.5rem 0;
			overflow-x: auto;
		}

		.article-body code {
			font-family: 'Fira Code', 'Courier New', Courier, monospace;
			font-size: 0.95rem;
		}

		.article-body p code {
			background: rgba(99, 102, 241, 0.15);
			color: #a5b4fc;
			padding: 0.2rem 0.5rem;
			border-radius: 0.4rem;
			border: 1px solid rgba(99, 102, 241, 0.2);
		}

		.article-body table {
			width: 100%;
			margin: 1.5rem 0;
			border-collapse: collapse;
			background: rgba(15, 23, 42, 0.5);
			border-radius: 0.8rem;
			overflow: hidden;
		}

		.article-body th, .article-body td {
			padding: 0.8rem 1rem;
			border: 1px solid var(--border-glass);
			color: #e2e8f0;
		}

		.article-body th {
			background: rgba(99, 102, 241, 0.2);
			font-weight: 600;
		}

		.share-btn {
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid var(--border-glass);
			color: var(--text-main);
			border-radius: 50%;
			width: 42px;
			height: 42px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: var(--transition);
			text-decoration: none !important;
		}

		.share-btn:hover {
			background: var(--primary-gradient);
			color: #fff;
			box-shadow: var(--shadow-glow);
		}

		.nav-article-card {
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid var(--border-glass);
			border-radius: 1rem;
			padding: 1.2rem;
			transition: var(--transition);
			text-decoration: none !important;
			display: block;
		}

		.nav-article-card:hover {
			border-color: var(--primary-color);
			background: rgba(255, 255, 255, 0.06);
		}
	</style>
</head>

<body>

					<li class="nav-item"><a href="../index.html#resume-section" class="nav-link"><span>Resume</span></a></li>

	<!-- Article Section -->
	<section class="py-5" style="margin-top: 5rem;">
		<div class="container" style="max-width: 900px;">
			<!-- Back Button -->
			<div class="mb-4">
				<a href="index.html" class="text-muted text-decoration-none small">
					<i class="fas fa-arrow-left me-2"></i> Back to Blog

			</div>

			<!-- Article Loading State -->
			<div id="article-loader" class="text-center py-5">

					<span class="sr-only">Loading article...</span>

			</div>

			<!-- Article Content Card -->
			<div id="article-container" class="glass-card p-4 p-md-5 d-none">
				<!-- Article Header -->
				<div class="mb-4">
					<div class="d-flex align-items-center flex-wrap gap-2 mb-3">

						</div>

						<!-- Social Share Buttons -->
						<div class="d-flex gap-2">
							<a href="#" id="share-linkedin" target="_blank" class="share-btn" title="Share on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
							<a href="#" id="share-twitter" target="_blank" class="share-btn" title="Share on X / Twitter"><i class="fab fa-x-twitter"></i></a>
							<button id="share-copy" class="share-btn" title="Copy Link"><i class="fas fa-link"></i></button>

				<!-- Cover Image -->
				<img id="post-cover" src="../images/blog/kotlin-coroutines.svg" class="article-cover" alt="Article Cover">

				<!-- Article Navigation (Next / Previous) -->

	<!-- Footer -->
	<footer class="py-4 border-top border-secondary mt-5" style="border-color: var(--border-glass) !important;">

	<!-- Libraries: jQuery, Bootstrap, Marked.js, Highlight.js, Front-matter -->
	<script src="../js/jquery.min.js"></script>
	<script src="../js/bootstrap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

	<script>
		$(document).ready(function() {
			const urlParams = new URLSearchParams(window.location.search);
			const slug = urlParams.get('slug');

			if (!slug) {
				window.location.href = 'index.html';
				return;
			}

			loadArticle(slug);
		});

		function parseFrontMatter(text) {
			const regex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
			const match = regex.exec(text);
			if (!match) return { meta: {}, content: text };

			const yamlLines = match[1].split('\n');
			const meta = {};
			let currentKey = null;

			yamlLines.forEach(line => {
				const trimmed = line.trim();
				if (!trimmed || trimmed.startsWith('#')) return;

				if (trimmed.startsWith('- ') && currentKey) {
					if (!Array.isArray(meta[currentKey])) meta[currentKey] = [];
					meta[currentKey].push(trimmed.replace(/^- /, '').replace(/^["']|["']$/g, ''));
					return;
				}

				const colonIdx = line.indexOf(':');
				if (colonIdx > -1) {
					const key = line.slice(0, colonIdx).trim();
					let val = line.slice(colonIdx + 1).trim();
					val = val.replace(/^["']|["']$/g, '');

					if (val === 'true') val = true;
					else if (val === 'false') val = false;

					meta[key] = val;
					currentKey = key;
				}
			});

			return { meta, content: match[2] };
		}

		function loadArticle(slug) {
			// Fetch raw markdown file
			$.ajax({
				url: `../content/blog/${slug}.md`,
				type: 'GET',
				dataType: 'text',
				success: function(markdownText) {
					const { meta, content } = parseFrontMatter(markdownText);

					// Configure Marked with Highlight.js
					marked.setOptions({
						highlight: function(code, lang) {
							if (lang && hljs.getLanguage(lang)) {
								return hljs.highlight(code, { language: lang }).value;
							}
							return hljs.highlightAuto(code).value;
						},
						breaks: true
					});

					// Render Article Metadata
					document.title = `${meta.title || slug} | Mohammad Asif Zafar`;
					$('#meta-title').text(`${meta.title || slug} | Mohammad Asif Zafar`);
					$('#meta-desc').attr('content', meta.description || '');
					$('#og-title').attr('content', meta.title || '');
					$('#og-desc').attr('content', meta.description || '');

					$('#post-title').text(meta.title || slug);
					$('#post-description').text(meta.description || '');
					$('#post-category').text(meta.category || 'Android');
					$('#post-date').text(meta.date || '');
					$('#post-author').text(meta.author || 'Mohammad Asif Zafar');

					if (meta.coverImage) {
						$('#post-cover').attr('src', `../${meta.coverImage}`).attr('alt', meta.title);
					} else {
						$('#post-cover').addClass('d-none');
					}

					// Calculate Reading Time
					const wordCount = content.trim().split(/\s+/).length;
					const readTimeMinutes = Math.max(1, Math.ceil(wordCount / 200));
					$('#post-readtime').text(`${readTimeMinutes} min read`);

					// Tags
					if (meta.tags && Array.isArray(meta.tags)) {
						const tagsHtml = meta.tags.map(t => `<span class="badge-tag">${t}</span>`).join(' ');
						$('#post-tags').html(tagsHtml);
					}

					// Render Markdown Body
					$('#post-body').html(marked.parse(content));

					// Apply Syntax Highlighting to Code Blocks
					document.querySelectorAll('pre code').forEach((el) => {
						hljs.highlightElement(el);
					});

					// Setup Sharing Links
					const articleUrl = encodeURIComponent(window.location.href);
					const articleTitle = encodeURIComponent(meta.title || '');
					$('#share-linkedin').attr('href', `https://www.linkedin.com/sharing/share-offsite/?url=${articleUrl}`);
					$('#share-twitter').attr('href', `https://twitter.com/intent/tweet?url=${articleUrl}&text=${articleTitle}`);
					$('#share-copy').on('click', function() {
						navigator.clipboard.writeText(window.location.href);
						alert('Article link copied to clipboard!');
					});

					// Load Next/Prev Navigation
					loadNavigation(slug);

					$('#article-loader').addClass('d-none');
					$('#article-container').removeClass('d-none');
				},
				error: function() {
					$('#article-loader').html(`
						<div class="text-center py-5">
							<i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
							<h4 class="text-main">Article Not Found</h4>
							<p class="text-muted">The requested blog post could not be loaded.</p>
							<a href="index.html" class="btn btn-primary rounded-pill mt-2">Return to Blog</a>
						</div>
					`);
				}
			});
		}

		function loadNavigation(currentSlug) {
			$.getJSON('../content/posts.json', function(data) {
				const posts = (data.posts || []).filter(p => p.published);
				const currentIndex = posts.findIndex(p => p.slug === currentSlug);

				if (currentIndex > 0) {
					const prev = posts[currentIndex - 1];
					$('#prev-article-container').html(`
						<a href="post.html?slug=${prev.slug}" class="nav-article-card">
							<span class="small text-muted d-block"><i class="fas fa-arrow-left me-1"></i> Previous Article</span>
							<strong class="text-main small">${prev.title}</strong>
						</a>
					`);
				}

				if (currentIndex < posts.length - 1 && currentIndex !== -1) {
					const next = posts[currentIndex + 1];
					$('#next-article-container').html(`
						<a href="post.html?slug=${next.slug}" class="nav-article-card">
							<span class="small text-muted d-block">Next Article <i class="fas fa-arrow-right ms-1"></i></span>
							<strong class="text-main small">${next.title}</strong>
						</a>
					`);
				}
			});
		}
	</script>
</body>
